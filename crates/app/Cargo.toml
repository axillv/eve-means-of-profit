[package]
name = "eve-means-of-profit"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/app.rs"

[dependencies]
mop-core = { version = "0.1.0", path = "../core" }
mop-esi = { version = "0.1.0", path = "../esi" }
mop-jeve = { version = "0.1.0", path = "../jeve" }
mop-market = { version = "0.1.0", path = "../market" }
mop-sde = { version = "0.1.0", path = "../sde" }
mop-store = { version = "0.1.0", path = "../store" }
eframe = "0.36.2"
egui = "0.36.2"
egui_dock = "0.21.1"
egui-phosphor = "0.14.0"
directories = "6.0.0"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
flate2 = "1.1.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lints]
workspace = true
