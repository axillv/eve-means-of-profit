[package]
name = "eve-means-of-profit"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/app.rs"

[dependencies]
profit-core = { version = "0.1.0", path = "../core" }
profit-market = { version = "0.1.0", path = "../market" }
profit-sde = { version = "0.1.0", path = "../sde" }
profit-store = { version = "0.1.0", path = "../store" }
eframe = "0.36.2"
egui = "0.36.2"
egui_dock = "0.21.1"
directories = "6.0.0"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lints]
workspace = true
