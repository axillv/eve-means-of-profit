[package]
name = "profit-esi"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
httpdate = "1.0.3"
getrandom = "0.4.3"
profit-core = { path = "../core" }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
